name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
        react: ["16.14.0", "17.0.2", "18.3.1", "19.0.0"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Pin React ${{ matrix.react }}
        shell: bash
        run: |
          # @testing-library/react@16 imports react-dom/client (React 18+).
          # For React 16/17 cells, install the last compatible TL major (12.x).
          # All version pins go through a single `npm install` so npm resolves
          # them together; otherwise a follow-up install can restore versions
          # from package-lock.json mid-pin.
          case "${{ matrix.react }}" in
            16.*|17.*)
              npm install --no-save --legacy-peer-deps \
                react@${{ matrix.react }} \
                react-dom@${{ matrix.react }} \
                @testing-library/react@12
              ;;
            *)
              npm install --no-save \
                react@${{ matrix.react }} \
                react-dom@${{ matrix.react }}
              ;;
          esac

      - run: npm run build
      - run: npm test
      - run: npm run test:types

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint

  size:
    name: bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run size
